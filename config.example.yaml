# Esempio di configurazione ka9q-tci.
#
# Uso:
#   ka9q-tci --config config.yaml ...
#
# Due formati supportati: multi-endpoint (preferito) e legacy single-list.
# Il bridge sceglie automaticamente in base alla presenza di `endpoints`.

# ── Forma multi-endpoint (preferita) ───────────────────────────────
# N server TCI distinti, uno per banda HF. Aggira il limite empirico
# TRX_COUNT ≤ 2 per server di alcuni client (es. SDC). Ogni endpoint:
#   - port:           porta WebSocket (obbligatoria)
#   - label:          nome banda, usato in logging (opzionale)
#   - iq_samplerate:  rate iniziale annunciato ai client (opzionale,
#                     fallback al default globale --iq-samplerate)
#   - trx:            almeno 1 TRX, max 2 (limite SDC)

# Frequenze centrali = metà tra inizio banda IARU R1 e centro FT8.
# Coprono CW sub-banda + FT8 + parte fonia digitale con un rate IQ
# di 96 kHz (passband ±48 kHz attorno al centro).

endpoints:
  - port: 40001
    label: 160m
    iq_samplerate: 96000
    trx:
      - { freq: 1825000, modulation: USB }      # (1810 + 1840) / 2

  - port: 40002
    label: 80m
    iq_samplerate: 96000
    trx:
      - { freq: 3536500, modulation: USB }      # (3500 + 3573) / 2

  - port: 40003
    label: 60m
    iq_samplerate: 96000
    trx:
      - { freq: 5354250, modulation: USB }      # (5351.5 + 5357) / 2 — R1 canalizzato

  - port: 40004
    label: 40m
    iq_samplerate: 96000
    trx:
      - { freq: 7037000, modulation: USB }      # (7000 + 7074) / 2

  - port: 40005
    label: 30m
    iq_samplerate: 48000
    trx:
      - { freq: 10118000, modulation: USB }     # (10100 + 10136) / 2 — WARC 50 kHz

  - port: 40006
    label: 20m
    iq_samplerate: 96000
    trx:
      - { freq: 14037000, modulation: USB }     # (14000 + 14074) / 2

  - port: 40007
    label: 17m
    iq_samplerate: 48000
    trx:
      - { freq: 18084000, modulation: USB }     # (18068 + 18100) / 2 — WARC 100 kHz

  - port: 40008
    label: 15m
    iq_samplerate: 96000
    trx:
      - { freq: 21037000, modulation: USB }     # (21000 + 21074) / 2

  - port: 40009
    label: 12m
    iq_samplerate: 48000
    trx:
      - { freq: 24902500, modulation: USB }     # (24890 + 24915) / 2 — WARC 100 kHz

  - port: 40010
    label: 10m
    iq_samplerate: 96000
    trx:
      - { freq: 28037000, modulation: USB }     # (28000 + 28074) / 2

# ── Forma legacy (singolo endpoint) ────────────────────────────────
# Compatibilità con i config pre-multi-endpoint. Se `endpoints` sopra è
# definito, questa sezione viene ignorata. Per usare la forma legacy,
# rimuovere/commentare il blocco `endpoints` e abilitare:
#
# trx:
#   - { freq: 7074000, modulation: USB }
#   - { freq: 14074000, modulation: USB, freq_b: 14076000 }
#
# Nella forma legacy: porta da `--bind-addr`, samplerate da
# `--iq-samplerate`, label = numero porta.
